[package]
name = "platformer"
description = "Legacy Trino example (2D-only): a tilemap platformer (physics, coins, goal, music) on PC, N64 and 3DS. Kept for tests and the editor's Level tab."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# rlib = static link (consoles, release); dylib = hot reload on PC dev.
[lib]
crate-type = ["rlib", "dylib"]

# Game crates may depend only on trino-core / trino-game-api
# (enforced by xtask/tests/dep_graph.rs).
[dependencies]
trino-core = { workspace = true }
trino-game-api = { workspace = true }
