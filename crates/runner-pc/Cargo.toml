[package]
name = "trino-runner-pc"
description = "Ready-made PC host for a Trino game: window, wgpu, audio, input, asset bake."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["heap-stats"]
# Count the system allocator as the heap (`HEAP`, `TRINO_FRAME heap=`).
heap-stats = []
# Rebake + re-upload assets live when a master changes.
watch = ["trino-asset-pipeline/watch"]
# Gamepads through gilrs (Linux: needs libudev-dev at build time).
gamepad = ["trino-platform-pc/gamepad"]
# Steam (issue #61): achievements, stats, Cloud, rich presence, Steam Input
# and the overlay through the Steamworks SDK (`steamworks`, which links
# libsteam_api dynamically; `cargo xtask package pc --steam` ships it).
steam = ["dep:steamworks"]
# Send crash reports to an https:// endpoint (`[pc] crash_upload`; plain
# http:// to a local collector needs nothing). Only with the player's yes.
crash-upload = ["dep:ureq"]
# Tracy (issue #62): the engine's zones, counters, frames and GPU passes in
# the Tracy profiler (on demand: connect a Tracy viewer to the running game).
tracy = ["trino-platform-pc/tracy"]

[dependencies]
trino-core = { workspace = true }
trino-platform-pc = { workspace = true }
trino-asset-pipeline = { workspace = true }
# Online play (issue #67): `TRINO_NET`.
trino-net = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
# `raw-bindings` exposes `steamworks::sys` (Steam Input's handle types).
steamworks = { version = "0.13.1", optional = true, features = ["raw-bindings"] }
ureq = { version = "3", optional = true }
# `TRINO_SCREENSHOT`: the last smoke frame as a PNG.
png = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
