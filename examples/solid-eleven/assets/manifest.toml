# The animation QA rig (every clip; model inspect --anim, the editor).

[models.se_player_rig]
file = "models/player_rig.glb"
platforms = ["pc"]
anim_fps = 15
once = ["pass", "lob", "shot", "tackle", "slide", "down", "header", "throw", "gk_dive", "ref_point", "ref_card", "flag_up"]

