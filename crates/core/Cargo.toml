[package]
name = "trino-core"
description = "Platform-agnostic traits and math for the Trino engine. no_std, zero dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# INVARIANT: this crate must never gain a dependency.
# Enforced by xtask/tests/dep_graph.rs, which fails CI if one is added.
[dependencies]

[features]
# The `zone!`/`counter`/`frame_mark` instrumentation (trace module, issue
# #62). Off by default: release builds are the same machine code.
trace = []
# Determinism guard rails (issue #67, `determinism` module): a NaN or a
# subnormal reaching a state hash, a rollback snapshot or a checked value
# panics with its name, because their bits and arithmetic differ between
# the PC, the N64 and the 3DS. Off by default (no code in release builds).
strict-determinism = []

# Zones on other threads (issue #130): the global ring is process-wide, so
# this test is a binary of its own.
[[test]]
name = "trace_threads"
required-features = ["trace"]
