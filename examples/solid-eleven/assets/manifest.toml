# Solid Eleven's assets (logical paths → masters under shared/, PC-only
# parts and overrides under pc/). Models are built by
# `cargo xtask blender solid-eleven` (tools/blender/solid_eleven_models.py);
# sprites, sounds and fonts by `cargo xtask gen-assets`... see AGENTS.md.
#
# Every console-visible model stays on the N64's RSP: opaque vertex colors,
# no palette, single-sided faces. Kits are tints at draw time.

version = 1

# ---- pitch (6 x 4 tiles with the lines in) ----

[models.se_pitch_0_0]
