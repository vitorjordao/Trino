[package]
name = "trino-runner-pc"
description = "Ready-made PC host for a Trino game: window, wgpu, audio, input, asset bake."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gamepad"]
# Rebake + re-upload assets live when a master changes.
watch = ["trino-asset-pipeline/watch"]
# Gamepads through gilrs (Linux: needs libudev-dev at build time).
gamepad = ["trino-platform-pc/gamepad"]

[dependencies]
trino-core = { workspace = true }
trino-platform-pc = { workspace = true }
trino-asset-pipeline = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
# Integration tests bake a synthetic project (the PC backend's fixture).
png = { workspace = true }
tempfile = { workspace = true }
