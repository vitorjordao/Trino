[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "examples/*", "xtask"]
# Scaffold templates keep their manifests as `Cargo.toml.tmpl` (rendered by
# `cargo xtask new`), so cargo never sees them as packages.

[workspace.package]
version = "0.2.0-dev.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vitorjordao/Trino"
rust-version = "1.93"

[workspace.dependencies]
# `xtask package`: deflate for the zips it writes (already in the tree via png).
flate2 = "1.1"
trino-core = { path = "crates/core" }
trino-game-api = { path = "crates/game-api" }
trino-platform-pc = { path = "crates/platform-pc" }
trino-platform-web = { path = "crates/platform-web" }
trino-render-wgpu = { path = "crates/render-wgpu" }
trino-platform-n64 = { path = "crates/platform-n64" }
trino-platform-3ds = { path = "crates/platform-3ds" }
trino-asset-pipeline = { path = "crates/asset-pipeline" }
trino-scene = { path = "crates/scene" }
trino-runner-pc = { path = "crates/runner-pc" }
trino-scaffold = { path = "crates/scaffold" }
trino-trace = { path = "crates/trace" }
trino-net = { path = "crates/net" }
hello-sprite = { path = "examples/hello-sprite" }
platformer = { path = "examples/platformer" }
castle64 = { path = "examples/castle64" }
showcase = { path = "examples/showcase" }
solid-eleven = { path = "examples/solid-eleven" }
winit = "0.30"
# wgpu 29 = what egui-wgpu 0.35 (the editor UI, Fase 3) resolves to. Keep in
# lockstep with the egui upgrade cadence, never bump one without the other.
wgpu = "29"
cpal = "0.18"
pollster = "0.4"
# The Web target (#47): wasm32-unknown-unknown bindings, browser APIs and a
# clock that works in a browser. wasm-bindgen is pinned exactly: the
# wasm-bindgen CLI `cargo xtask build web` runs must be the same version.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
web-time = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
# Rollback netcode (issue #67): GGPO's model in Rust. trino-net wraps it;
# games only see `Platform::players`.
ggrs = { version = "0.13", default-features = false }
hound = "3"
# glTF 2.0 import for the 3D model pipeline (Fase 7).
gltf = { version = "1", features = ["extras"] }
# TTF/OTF font masters -> bitmap atlases (the version egui already pulls).
ab_glyph = "0.2"
# README gameplay recording (dev utility in xtask).
gif = "0.13"
# PC BCn textures (#52 phase 3): BC1/BC3 encoder (a libsquish port, pure
# Rust) and an independent BC1..BC7 decoder for previews and the CPU
# fallback. BC7 is encoded in-house (`texture/bc.rs`).
texpresso = { version = "2", default-features = false }
bcdec_rs = "0.2"
# Web textures (#47, KTX2): Binomial's Basis Universal encoder and
# transcoder (C++, built by `cc`). Host tools only: the browser runs the
# same transcoder compiled to WebAssembly (`apps/web/vendor/basis`).
basis-universal = "0.3"
# Audio (#53): Ogg Vorbis on the PC and the Web. lewton decodes (pure Rust,
# also in the browser's wasm); vorbis_rs encodes in the bake (libvorbis with
# aoTuV, C built by `cc`: host tools only).
lewton = "0.10"
vorbis_rs = "0.5"
notify = "8"
notify-debouncer-full = "0.6"
hot-lib-reloader = "0.8.2"
libloading = "0.9"
tempfile = "3"
ron = "0.12"
# Editor UI. egui-wgpu 0.35 <-> wgpu 29: bump only in lockstep.
eframe = { version = "0.35", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui_dock = "0.20"
# Headless editor UI tests; same lockstep as eframe/egui.
egui_kittest = { version = "0.35", features = ["eframe", "wgpu"] }
# Icon font for the editor. 0.13 is the line built on egui 0.35 — bump in
# lockstep with eframe/egui (0.14 already requires egui 0.36).
egui-phosphor = "0.13"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
