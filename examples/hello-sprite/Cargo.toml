[package]
name = "hello-sprite"
description = "Legacy minimal Trino example (2D-only): move a sprite, play a sound. Kept for the hot-reload end-to-end test."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# rlib = static link (consoles, release); dylib = hot reload on PC dev.
[lib]
crate-type = ["rlib", "dylib"]

# Game crates may depend only on trino-core / trino-game-api
# (enforced by xtask/tests/dep_graph.rs).
[dependencies]
trino-core = { workspace = true }
trino-game-api = { workspace = true }
