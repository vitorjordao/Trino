# ---- fonts (Roboto Condensed Bold, Apache-2.0: fonts/LICENSE-Roboto.txt) ----
# The UI font is caps, digits, punctuation and Portuguese accents: 11 px, an
# I4 atlas that fits the N64's TMEM (the resident text path).
[fonts.se_ui]
file = "fonts/RobotoCondensed-Bold.ttf"
size = 11
antialias = true
chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;-+/%!?()'&#<>*=_ÁÂÃÀÇÉÊÍÓÔÕÚÜ"
formats = { n64 = "I4" }

# Titles (and the PC's 2x interface).
[fonts.se_big]
file = "fonts/RobotoCondensed-Bold.ttf"
size = 22
antialias = true
chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;-+/%!?()'&#<>*=_ÁÂÃÀÇÉÊÍÓÔÕÚÜ"
formats = { n64 = "I4" }

