# Every asset the engine knows about, under a logical path.
# Handle = fnv1a(logical path); games use SpriteId::from_path("sprites/player").
#
# Masters live in shared/; a file at <platform>/<same path> overrides the
# master for that platform only. Formats are per-platform; N64 has no safe
# default (TMEM is 4 KB) so its format must be declared explicitly.

version = 1

[sprites.player]
file = "sprites/player.png"
formats = { n64 = "CI4" }

[sprites.hero]
file = "sprites/hero.png"
formats = { n64 = "CI4" }

[sprites.ground]
file = "sprites/ground.png"
formats = { n64 = "CI4" }

[sprites.brick]
file = "sprites/brick.png"
formats = { n64 = "CI4" }

[sprites.coin]
file = "sprites/coin.png"
formats = { n64 = "CI4" }

[sprites.flag]
file = "sprites/flag.png"
formats = { n64 = "CI4" }

[sounds.beep]
file = "sounds/beep.wav"

[sounds.jump]
file = "sounds/jump.wav"

[sounds.coin]
file = "sounds/coin.wav"

[sounds.win]
file = "sounds/win.wav"

[music.theme]
file = "music/theme.wav"

[models.cube]
file = "models/cube.glb"

# ---- castle64 (jogo de stress-test local; diff nao commitado) ----

[sprites.c64_star]
file = "sprites/castle64/star.png"
formats = { n64 = "CI4" }

[models.c64_block_grass]
file = "models/castle64/block_grass.glb"

[models.c64_block_stone]
file = "models/castle64/block_stone.glb"

[models.c64_block_brick]
file = "models/castle64/block_brick.glb"

[models.c64_block_castle]
file = "models/castle64/block_castle.glb"

[models.c64_block_roof]
file = "models/castle64/block_roof.glb"

[models.c64_block_lava]
file = "models/castle64/block_lava.glb"

[models.c64_coin]
file = "models/castle64/coin.glb"

[models.c64_star]
file = "models/castle64/star.glb"

[models.c64_player_torso]
file = "models/castle64/player_torso.glb"

[models.c64_player_arm]
file = "models/castle64/player_arm.glb"

[models.c64_player_leg]
file = "models/castle64/player_leg.glb"

[models.c64_boar]
file = "models/castle64/boar.glb"

[models.c64_shadow]
file = "models/castle64/shadow.glb"

[models.c64_door_frame]
file = "models/castle64/door_frame.glb"

# Porta real low-poly: KayKit Dungeon Remastered (CC0, Kay Lousberg) —
# textura de paleta amostrada para vertex colors no bake; tint por destino.
[models.c64_door]
file = "models/castle64/door_kaykit.glb"

# ---- editor showcase (scenes/showcase.scene.ron) ----
# Fake objects: parametric placeholders (.prim.ron). Swap `file` for a
# real .glb later — the handle and every reference stay the same.

[models.ground]
file = "models/proxies/ground.prim.ron"

# Textured fake objects: UVs are generated (one repeat per meter) and
# the default texture is baked in; materials can override it.
[models.crate]
file = "models/proxies/crate.prim.ron"
texture = "sprites/tex_planks"

[models.pillar]
file = "models/proxies/pillar.prim.ron"
texture = "sprites/tex_bricks"

[models.rock]
file = "models/proxies/rock.prim.ron"

[models.ramp]
file = "models/proxies/ramp.prim.ron"

[models.tree-trunk]
file = "models/proxies/tree-trunk.prim.ron"

[models.tree-top]
file = "models/proxies/tree-top.prim.ron"

[models.lamp-post]
file = "models/proxies/lamp-post.prim.ron"

[models.lamp-bulb]
file = "models/proxies/lamp-bulb.prim.ron"

[models.coin-ring]
file = "models/proxies/coin-ring.prim.ron"

[models.water]
file = "models/proxies/water.prim.ron"

[models.hero-capsule]
file = "models/proxies/hero-capsule.prim.ron"

# Animated rigid-part models (generated by `cargo xtask gen-assets`; the
# same shape the blender-asset skill exports). `once` clips clamp.
[models.robot]
file = "models/showcase/robot.glb"
anim_fps = 20
once = ["wave"]

[models.windmill]
file = "models/showcase/windmill.glb"

# ---- fonts (bitmap text: atlas sprite + glyph table under one handle) ----

# trino5x7: the engine's default pixel font (xtask gen-assets draws it).
[fonts.trino5x7]
file = "fonts/trino5x7.png"
cell = [6, 10]

# ---- blobs (raw bytes by handle: Platform::blob) ----

# Read back by the console self-tests (castle64::selftest).
[blobs.selftest]
file = "data/selftest.txt"

# ---- scenes (editor scenes baked to TSCN, loaded at runtime) ----

# Paths are relative to the project root. Games read them with
# BakedScene::parse(platform.blob(BlobId::from_path("scenes/showcase"))).
[scenes.showcase]
file = "scenes/showcase.scene.ron"

# 32x32 grayscale tiles for textured 3D (tinted by vertex color/material).
[sprites.tex_planks]
file = "sprites/textures/tex_planks.png"
formats = { n64 = "CI8" }

[sprites.tex_bricks]
file = "sprites/textures/tex_bricks.png"
formats = { n64 = "CI8" }

# Particle sprite (billboards): white sparkle tinted by the emitter.
[sprites.fx_spark]
file = "sprites/textures/fx_spark.png"
formats = { n64 = "CI4" }

# ---- self-test content (castle64::selftest::textured_3d) ----

[sprites.selftest_quadrants]
file = "sprites/selftest_quadrants.png"
formats = { n64 = "CI4" }

# Textured fake object: UVs kept, default texture baked in.
[models.selftest_card]
file = "models/proxies/selftest-card.prim.ron"
texture = "sprites/selftest_quadrants"
