[package]
name = "trino-asset-pipeline"
description = "Asset baking for Trino: manifest parsing, hybrid shared/per-platform resolution, bake to native formats, loading and hot-reload watching."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# File watching for live reload (dev-only; console builds never enable it).
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
trino-core = { workspace = true }
# Baked scenes ([scenes.*] -> TSCN) resolve scenes/prefabs/materials.
trino-scene = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# `ship`: trino.toml's packaging keys edited in place (comments kept).
toml_edit = "0.25"
png = { workspace = true }
hound = { workspace = true }
gltf = { workspace = true }
ron = { workspace = true }
ab_glyph = { workspace = true }
texpresso = { workspace = true }
bcdec_rs = { workspace = true }
basis-universal = { workspace = true }
lewton = { workspace = true }
vorbis_rs = { workspace = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
