[package]
name = "trino-platform-pc"
description = "PC backend for Trino: wgpu 2D renderer with console-simulation profiles, cpal audio, keyboard input."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Within the workspace this crate may depend only on trino-core and the
# shared wgpu renderer (enforced by xtask/tests/dep_graph.rs). External
# crates are fine.
[dependencies]
trino-core = { workspace = true }
trino-render-wgpu = { workspace = true }
wgpu = { workspace = true }
cpal = { workspace = true }
lewton = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
# Gamepads (feature `gamepad`). On Linux gilrs links libudev: install
# libudev-dev (Debian/Ubuntu) / systemd-devel (Fedora) to enable it.
gilrs = { version = "0.11", optional = true }

[features]
default = []
gamepad = ["dep:gilrs"]

[dev-dependencies]
png = { workspace = true }
# Golden tests of the real showcase game + baked 3D models (dev-only: the
# dep-graph rule about platform crates concerns normal dependencies).
platformer = { workspace = true }
trino-asset-pipeline = { workspace = true }
# Integration tests bake synthetic projects into temp dirs.
tempfile = { workspace = true }
