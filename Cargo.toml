[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "examples/*", "xtask"]
# Scaffold templates keep their manifests as `Cargo.toml.tmpl` (rendered by
# `cargo xtask new`), so cargo never sees them as packages.

[workspace.package]
version = "0.2.0-dev.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vitorjordao/Trino"
rust-version = "1.93"

[workspace.dependencies]
trino-core = { path = "crates/core" }
trino-game-api = { path = "crates/game-api" }
trino-platform-pc = { path = "crates/platform-pc" }
trino-platform-n64 = { path = "crates/platform-n64" }
trino-platform-3ds = { path = "crates/platform-3ds" }
trino-asset-pipeline = { path = "crates/asset-pipeline" }
trino-scene = { path = "crates/scene" }
trino-runner-pc = { path = "crates/runner-pc" }
trino-scaffold = { path = "crates/scaffold" }
hello-sprite = { path = "examples/hello-sprite" }
platformer = { path = "examples/platformer" }
castle64 = { path = "examples/castle64" }
showcase = { path = "examples/showcase" }
winit = "0.30"
# wgpu 29 = what egui-wgpu 0.35 (the editor UI, Fase 3) resolves to. Keep in
# lockstep with the egui upgrade cadence, never bump one without the other.
wgpu = "29"
cpal = "0.18"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
hound = "3"
# glTF 2.0 import for the 3D model pipeline (Fase 7).
gltf = { version = "1", features = ["extras"] }
# TTF/OTF font masters -> bitmap atlases (the version egui already pulls).
ab_glyph = "0.2"
# README gameplay recording (dev utility in xtask).
gif = "0.13"
notify = "8"
notify-debouncer-full = "0.6"
hot-lib-reloader = "0.8.2"
libloading = "0.9"
tempfile = "3"
ron = "0.12"
# Editor UI. egui-wgpu 0.35 <-> wgpu 29: bump only in lockstep.
eframe = { version = "0.35", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "x11",
    "wayland",
] }
egui_dock = "0.20"
# Headless editor UI tests; same lockstep as eframe/egui.
egui_kittest = { version = "0.35", features = ["eframe", "wgpu"] }
# Icon font for the editor. 0.13 is the line built on egui 0.35 — bump in
# lockstep with eframe/egui (0.14 already requires egui 0.36).
egui-phosphor = "0.13"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
