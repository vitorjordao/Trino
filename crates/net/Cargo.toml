[package]
name = "trino-net"
description = "Network play for Trino games (issue #67): rollback sessions over ggrs, a simulated network for tests, UDP on the PC, WebRTC data channels on the Web, and the lobby protocol. Games only see Platform::players."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trino-core = { workspace = true }
ggrs = { workspace = true }
serde = { workspace = true }
# ggrs's own message encoding (its UDP socket uses it too).
bincode = "1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ggrs = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "BinaryType",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceServer",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "WebSocket",
] }

[dev-dependencies]
# The rollback sync test plays Solid Eleven (issue #67).
solid-eleven = { workspace = true }
