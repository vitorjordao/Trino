# Console packaging for {{name}} (read by the engine's xtask:
# `cargo trino build|run|test n64|3ds|web`).
[project]
name = "{{name}}"
title = "{{name}}"
description = "A Trino game"
author = ""
# The platforms this project ships on (without the line: pc, n64 and 3ds). Batch commands
# (`cargo trino build all`, `assets all`, `test all`) skip the others, and
# naming one (`cargo trino build n64`) fails. Remove a console here and its
# section below may go too.
platforms = ["pc", "n64", "3ds", "web"]

# The desktop host crate (`cargo trino build|run pc`); default "<name>-pc".
# [pc]
# package = "{{name}}-pc"
# The PC's and the Web's quality presets (ADR 0023): what a first launch
# runs at ("auto": a calibration of at most 3 s picks the highest preset
# that holds the frame rate; or low|medium|high|ultra) and the file that
# tunes Low…Ultra (`cargo trino quality set`, the editor's Quality tab).
# [pc.quality]
# default = "auto"
# presets = "assets/quality.ron"

# The browser build (`cargo trino build|run|test web`): every key optional.
# [web]
# package = "{{name}}-web"   # the wasm host crate (default <name>-web)
# canvas_id = "trino-canvas"
# page_title = "{{name}}"

# Shipping on PC (docs/SHIPPING.md): `cargo trino package pc` builds the
# game as players get it — AppImage (Linux), zip with an .exe carrying the
# icon and version (Windows), .app/.dmg (macOS) — with the assets baked in
# and saves in the player's data folder. Every key is optional and goes in
# the [pc] table above (beside `package`):
# icon = "assets/platform/pc/icon.png"   # square PNG, 256 x 256 or bigger
# identifier = "com.example.{{name}}"     # macOS bundle id / Linux app id
# publisher = "Example Games"            # default [project] author
# version = "1.0.0"                      # default the pc crate's version
# features = ["gamepad"]                 # the pc crate's features in a package
# profile = "native"                     # or n64 / 3ds: the look it starts in
# crash_upload = "https://crash.example.com/report"   # only with the player's yes

# Steam (`cargo trino package pc --steam`, `cargo trino services export steam`,
# the pc crate's `steam` feature): achievements, stats, Cloud, rich presence.
# [steam]
# app_id = 480                            # 480 = Spacewar, Valve's test app
# depots = { windows = 481, linux = 482, macos = 483 }

# itch.io (`cargo trino package pc --itch`): butler's channels.
# [itch]
# target = "user/{{name}}"

[n64]
package = "{{name}}-n64"
save = "eeprom16k"

[3ds]
package = "{{name}}-3ds"
bin = "{{name}}-3ds"
# The New 3DS runs at 804 MHz (its expanded tier, `n3ds_new` content) unless:
# speedup = false

[test]
# 30 fps in emulated N64 time (the self-test's TRINO_FRAME lines).
n64_max_frame_us = 33333
