[package]
name = "trino-editor"
description = "Trino's visual editor: dockable viewport with console-simulation preview, scene hierarchy, inspector, asset browser, play mode."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "trino-editor"
path = "src/main.rs"

[dependencies]
# The Net tab: the session settings and `[net]` (issue #67).
trino-net = { workspace = true }
trino-core = { workspace = true }
trino-scene = { workspace = true }
trino-platform-pc = { workspace = true }
# Play in editor: the scene runtime (tag rules: player / coin / goal).
showcase = { workspace = true }
# Project launcher: "Create new project" (same scaffolder as `xtask new`).
trino-scaffold = { workspace = true }
# The Profiler tab (issue #62): the same trace loader and statistics as `cargo xtask trace`.
trino-trace = { workspace = true }
trino-asset-pipeline = { workspace = true, features = ["watch"] }
eframe = { workspace = true }
egui_dock = { workspace = true }
egui-phosphor = { workspace = true }
wgpu = { workspace = true }
notify-debouncer-full = { workspace = true }
ron = { workspace = true }
png = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Headless panel-flow tests (the egui 0.35 line).
egui_kittest = { workspace = true }
