[package]
name = "solid-eleven"
description = "Solid Eleven: a low-poly 3D football game for Trino. Runs on PC, Nintendo 64 and Nintendo 3DS."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# rlib = static link (consoles, release); dylib = hot reload on PC dev.
[lib]
crate-type = ["rlib", "dylib"]

[features]
default = []
# Hot-reload exports (`trino_game_api::export_game!`). Off by default: apps/pc
# links castle64, showcase *and* this crate statically, and two games
# exporting the same `#[no_mangle]` symbols cannot share one binary. Enable it
# when this crate is the one `cargo xtask watch pc --game solid-eleven`
# hot-swaps.
hot-reload = []

# Game crates may depend only on trino-core / trino-game-api
# (enforced by xtask/tests/dep_graph.rs).
[dependencies]
trino-core = { workspace = true }
trino-game-api = { workspace = true }
