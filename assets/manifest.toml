# Animated rigid-part models (generated by `cargo xtask gen-assets`; the
# same shape the blender-asset skill exports). `once` clips clamp.
[models.robot]
file = "models/showcase/robot.glb"
anim_fps = 20
once = ["wave"]
# Compressed clips (issue #65, TMDL `ANMC`): 20.9 KB of samples -> 1.9 KB.
anim_compression = true

[models.windmill]
file = "models/showcase/windmill.glb"
anim_compression = true

# The strider (issue #65, generated by `cargo xtask gen-assets`): the
# reference for root motion (its walk and run surge; the bake moves the
# root's ground motion into a track and the clip plays in place), timeline
# events, the animation graph (`assets/anim/strider.anim.ron`) and foot IK
# (thigh -> shin -> foot chains). Its clips are compressed (`ANMC`: 42 KB
# of samples -> 6 KB of tracks, every frame within 0.5 deg / 2 mm).
[models.strider]
file = "models/showcase/strider.glb"
anim_fps = 20
once = ["hop"]
root_motion = ["walk", "run"]
anim_compression = true
ik = { pelvis = "hips", left = ["thigh_l", "shin_l", "foot_l"], right = ["thigh_r", "shin_r", "foot_r"] }
# Its own group: the base N64's RAM has no room for it at boot; the
# self-test's animation steps load it (castle64::selftest::anim_steps).
groups = ["strider"]
events.walk = [{ at = 0.0, name = "foot_l" }, { at = 0.5, name = "foot_r" }]
events.run = [{ at = 0.0, name = "foot_l" }, { at = 0.3, name = "foot_r" }]
events.hop = [{ at = 0.4, name = "sfx:jump" }, { at = 0.7, name = "land" }]

# The river (issue #49, ADR 0015), generated by `cargo xtask gen-assets`
# from `showcase::river` (the course the game walks on): the ground carved
