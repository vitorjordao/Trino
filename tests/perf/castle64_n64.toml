# castle64 frame-cost ceilings on the N64, in emulated microseconds per
# frame (ares; `cargo xtask test n64` fails a scene above its ceiling).
# frame_us = update + render - begin (begin waits for vsync/RDP).
# Generated by `cargo xtask test n64 --bless`: measured + 0.5 ms + 20%
# (frame) or 35% (stages) — code layout alone moves a stage ~20%.
# Bless after an optimization too, so the gain is kept. 60 fps = 16667,
# 30 fps = 33333.

[hub]
frame_us = 13300
tnl_us = 4000
sort_us = 600
submit_us = 2000

[green-hills]
frame_us = 9100
tnl_us = 2900
sort_us = 600
submit_us = 1700

[lava-land]
frame_us = 9700
tnl_us = 3200
sort_us = 600
submit_us = 1800

[sky-tower]
frame_us = 7800
tnl_us = 1800
sort_us = 600
submit_us = 1200

[throne]
frame_us = 19800
tnl_us = 10000
sort_us = 1000
submit_us = 2900

# The showcase's river (water, ADR 0015; `showcase::perf::river_scene`):
# the whole fogged, colored-light showcase on the CPU T&L path, so ~4 fps
# on the N64 — gated so it doesn't get worse.
[showcase-river]
frame_us = 342000
tnl_us = 211900
sort_us = 39000
