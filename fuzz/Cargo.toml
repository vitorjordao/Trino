# cargo-fuzz targets (issue #68): one libFuzzer binary per parser, each a
# one-liner over `trino_fuzz` (crates/fuzz), whose stable tests replay the
# same bodies on every PR. Run through `cargo xtask fuzz run <target>`
# (nightly + cargo-fuzz); `crates/fuzz/tests/targets.rs` holds this list to
# `trino_fuzz::TARGETS`. Its own workspace: never part of the engine's.
[package]
name = "trino-fuzz-targets"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
trino-fuzz = { path = "../crates/fuzz" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "tmdl"
path = "fuzz_targets/tmdl.rs"
test = false
doc = false
bench = false

