# castle64 frame-cost ceilings on the N64, in emulated microseconds per
# frame (ares; `cargo xtask test n64` fails a scene above its ceiling).
# frame_us = update + render - begin (begin waits for vsync/RDP).
# Generated by `cargo xtask test n64 --bless`: measured + 0.5 ms + 20%
# (frame) or 35% (stages) — code layout alone moves a stage ~20%.
# Bless after an optimization too, so the gain is kept. 60 fps = 16667,
# 30 fps = 33333.

[hub]
frame_us = 78500
tnl_us = 60900
sort_us = 5600
submit_us = 16800

