name: CI

on:
  pull_request:

jobs:
  diag:
    name: diag precompile (${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p trino-platform-pc --test precompile --no-run
      - name: each test alone, three times
        shell: bash
        env:
          RUST_BACKTRACE: "1"
          WGPU_DEBUG: "0"
        run: |
          set +e
          for i in 1 2 3; do
            for t in a_background_warm_up_keeps_frames_coming_and_ends a_frame_waits_for_the_pass_a_worker_is_compiling a_full_warm_up_leaves_nothing_to_compile_in_frames only_the_current_settings_are_warmed_by_current the_pipeline_cache_round_trips_through_its_file; do
              cargo test -q -p trino-platform-pc --test precompile -- --exact $t --nocapture --test-threads=1 > out.txt 2>&1
              code=$?
              echo "RESULT $i $t exit=$code"
              if [ $code -ne 0 ]; then tail -40 out.txt; fi
            done
          done
          echo "== all together"
          for i in 1 2 3; do
            cargo test -q -p trino-platform-pc --test precompile -- --nocapture > out.txt 2>&1
            code=$?
            echo "RESULT all $i exit=$code"; tail -30 out.txt
          done
  diag-editor:
    name: diag editor ui (${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: editor ui three times
        env:
          TRINO_REQUIRE_GPU: "1"
        run: |
          set +e
          for i in 1 2 3; do
            xvfb-run -a cargo test -p trino-editor ui_tests -- --ignored --test-threads=1 > out.txt 2>&1
            echo "RESULT $i exit=$?"
            grep -E "FAILED|panicked" -A40 out.txt | head -80
          done
