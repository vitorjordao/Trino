[package]
name = "xtask"
description = "Build orchestrator: cargo xtask <command> <platform>. The only entry point contributors and CI need."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
trino-core = { workspace = true }
trino-asset-pipeline = { workspace = true, features = ["watch"] }
trino-scene = { workspace = true }
# `new --standalone` (shared with the editor's project launcher).
trino-scaffold = { workspace = true }
# The showcase's river course: `gen-assets` builds its meshes from it.
showcase = { workspace = true }
# `replay run --platform pc` replays the engine's games headless (#67).
castle64 = { workspace = true }
solid-eleven = { workspace = true }
# `net lobby`: the rooms online players meet in (UDP for the PC, a
# WebSocket for the Web's WebRTC signalling; issue #67).
trino-net = { workspace = true }
tungstenite = "0.30"
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
png = { workspace = true }
# `package`: the zips (deflate, CRC-32).
flate2 = { workspace = true }
hound = { workspace = true }
# `blender smoke` parses the toolkit's JSON report.
serde_json = { workspace = true }
# perf baselines (tests/perf/*.toml).
toml = { workspace = true }
# trino.toml (external console projects).
serde = { workspace = true }
# `build web`: the asset pack format (the browser reads it back).
trino-platform-web = { workspace = true }
# `ui shot`: a screen rendered headless as each target shows it (the
# renderer alone: no audio, so no ALSA for the console jobs).
trino-render-wgpu = { workspace = true }
pollster = { workspace = true }
# `trace collect|report|diff` and the test runs' trace capture (issue #62).
trino-trace = { workspace = true }

[dev-dependencies]
libloading = { workspace = true }
tempfile = { workspace = true }
trino-core = { workspace = true }
trino-game-api = { workspace = true }
hello-sprite = { workspace = true }
platformer = { workspace = true }
castle64 = { workspace = true }
showcase = { workspace = true }
solid-eleven = { workspace = true }
trino-platform-pc = { workspace = true }
trino-runner-pc = { workspace = true }
gif = { workspace = true }
