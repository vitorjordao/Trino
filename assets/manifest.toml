# Every asset the engine knows about, under a logical path.
# Handle = fnv1a(logical path); games use SpriteId::from_path("sprites/player").
#
# Masters live in shared/; a file at <platform>/<same path> overrides the
# master for that platform only. Formats are per-platform; N64 has no safe
# default (TMEM is 4 KB) so its format must be declared explicitly.

version = 1

[sprites.player]
file = "sprites/player.png"
formats = { n64 = "CI4" }

[sprites.hero]
file = "sprites/hero.png"
formats = { n64 = "CI4" }

[sprites.ground]
file = "sprites/ground.png"
formats = { n64 = "CI4" }

[sprites.brick]
file = "sprites/brick.png"
formats = { n64 = "CI4" }

[sprites.coin]
file = "sprites/coin.png"
formats = { n64 = "CI4" }

[sprites.flag]
file = "sprites/flag.png"
formats = { n64 = "CI4" }

[sounds.beep]
file = "sounds/beep.wav"
caption = "cap.hurt"
important = true
caption_priority = 150

[sounds.jump]
file = "sounds/jump.wav"

# Captions (issue #60): a string-table key (assets/i18n/<lang>.ron) shown
# while the sound plays, when the player's caption mode wants it; an
# `important` sound shows in the "important" mode too and must have one.
[sounds.coin]
file = "sounds/coin.wav"
caption = "cap.coin"

[sounds.win]
file = "sounds/win.wav"
caption = "cap.star"
important = true
caption_priority = 200

# Music streams by default (`stream = true`) in each platform's default
# codec: VADPCM on the N64, DSP-ADPCM on the 3DS, Vorbis on the PC and Web
# (issue #53, ASSETS.md "Audio").
[music.theme]
file = "music/theme.wav"

# Positional ambience (scene `sound` components): loops, so on the N64 the
# loop is baked into the wav64.
[sounds.water]
file = "sounds/water.wav"
loop = true

# The river: a splash where something enters it, and its murmur (a
# positional loop along the course).
[sounds.water_splash]
file = "sounds/water_splash.wav"

[sounds.river_flow]
file = "sounds/river_flow.wav"
loop = true

# A stinger: plays once over the music (Audio::play_stinger) — no loop.
[music.fanfare]
file = "sounds/win.wav"
loop = false

[models.cube]
file = "models/cube.glb"

