# The photo-like card of the 3DS texture-formats golden, as the master and
# in two lossy 3DS formats. The N64 never draws it: its override
# (`assets/n64/sprites/selftest_photo.png`) is a 4×4 white card (exact in
# CI8, so a `min_psnr` holds), so the base N64's 4 MB don't keep three
# 4.5 KB copies of a picture (#67, #110).
[sprites.selftest_photo]
file = "sprites/selftest_photo.png"
formats = { n64 = "CI8", 3ds = "RGBA8" }

[sprites.selftest_photo_etc1]
file = "sprites/selftest_photo.png"
formats = { n64 = "CI8", 3ds = "ETC1" }

[sprites.selftest_photo_rgba4]
file = "sprites/selftest_photo.png"
formats = { n64 = "CI8", 3ds = "RGBA4" }

# Two-joint strip with one 50/50 vertex: smooth skinning (SKW2) on every
# target (selftest::smooth_skin).
[models.selftest_strip]
file = "models/proxies/selftest-strip.gltf"
skinning = "smooth"

# Textured fake object: UVs kept, default texture baked in.
[models.selftest_card]
file = "models/proxies/selftest-card.prim.ron"
texture = "sprites/selftest_quadrants"

# The same card, only in the expanded tiers' data (issue #54): in the N64
# ROM and the 3DS app, loaded on the Expansion Pak / the New 3DS only
# (selftest::hw_tier).
[models.selftest_tier_card]
file = "models/proxies/selftest-card.prim.ron"
platforms = ["n64_expanded", "n3ds_new"]

# White card in color slots 0, 1 and 4 (glTF `_SLOT`): a per-draw palette
# recolors it on every target (selftest::palette).
[models.selftest_slots]
file = "models/proxies/selftest-slots.gltf"

# A white panel between two fins, with ambient occlusion baked into its
# vertex colors and without: the consoles' AO, the same on every target
# (selftest::ambient_occlusion).
[models.selftest_ao]
file = "models/proxies/selftest-ao.gltf"
ao = { strength = 0.9, distance = 0.5 }

[models.selftest_ao_raw]
file = "models/proxies/selftest-ao.gltf"

# The post step (selftest::post, issue #64): an orange card whose colors
# the consoles' bake grades through `luts/selftest` (a channel rotation),
# what the PC's post stack does at run time. The same graded color on
# every target is the baked tier matching the PC's.
[models.selftest_post]
file = "models/proxies/selftest-post.prim.ron"
grading = "luts/selftest"

# The shadows step (selftest::shadows, ADR 0025): a floor, a post that
# casts its shape and a ball held up that casts by tier.
[models.selftest_shadow_floor]
file = "models/proxies/selftest-shadow-floor.prim.ron"

[models.selftest_shadow_post]
file = "models/proxies/selftest-shadow-post.prim.ron"

[models.selftest_shadow_ball]
file = "models/proxies/selftest-shadow-ball.prim.ron"

# A translucent 4 x 4 m water sheet (8 x 8 quads) for the water step
# (selftest::water): generated with the river by `cargo xtask gen-assets`.
[models.selftest_water]
file = "models/proxies/selftest-water.glb"
texture = "sprites/tex_water"

[sprites.impostor-selftest-boar]
file = "impostors/selftest-boar.png"
formats = { n64 = "CI4" }

[blobs.impostor-selftest-boar]
file = "impostors/selftest-boar.timp"

[particles.selftest-sparks]
file = "particles/selftest-sparks.particles.ron"

# Capped 4, 6 on the expanded tiers (selftest::hw_tier, issue #54).
[particles.selftest-tier-sparks]
file = "particles/selftest-tier-sparks.particles.ron"

# The post stack (issue #64, ADR 0033). The engine's halo: glows
# (`trino_core::Glow`) are the consoles' bloom.
[sprites.glow]
file = "sprites/glow.png"
formats = { n64 = "I4" }

# Grading LUTs: `TLUT` blobs on the PC and the Web (the post stack grades
# the frame), baked into the colors of the assets that name them on the
# consoles. `selftest` rotates the channels (selftest::post); `dusk` is a
# warm evening grade for demos.
[luts.selftest]
file = "luts/selftest.png"

[luts.dusk]
file = "luts/dusk.png"

# The post stack's reference scene: the consoles' bake grades its colors
# (`bake_grading`), the PC's post stack the frame (xtask/tests/post_cli.rs).
[scenes.post-reference]
file = "scenes/post-reference.scene.ron"
bake_grading = true
