name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy + dep graph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # clippy compiles cpal (ALSA) and apps/pc (gilrs/libudev) even though lint never plays audio.
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The runner's opt-in shipping features (issue #61): Steam (links
      # libsteam_api at run time only) and the https crash upload.
      - run: cargo clippy -p trino-runner-pc --features steam,crash-upload,gamepad --all-targets -- -D warnings
      - run: cargo test -p trino-runner-pc --features steam store
      # The timeline trace (issue #62) is compiled out by default, so no gate
      # above builds the zones: the whole workspace with them in, the core's
      # global ring, and Tracy (its C++ client) on the PC.
      - run: cargo clippy --workspace --all-targets --features trino-core/trace -- -D warnings
      - run: cargo test -p trino-core --features trace --lib trace
      - run: cargo clippy -p trino-app-pc --features tracy --all-targets -- -D warnings
      # Achievements: castle64's table checks out, the Deck checklist passes.
      - run: cargo xtask services check
      - run: cargo xtask deck check
      # Authored content (scenes / prefabs / materials) resolves cleanly and
      # the AI skill mirrors match .agents/skills/.
      - run: cargo xtask scene check
      - run: cargo xtask agents check

  desktop:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Labels pinned on purpose: GitHub runner images are migrating through
        # 2026 and `-latest` moves under you. macos-latest is Apple Silicon.
        os: [ubuntu-24.04, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cpal needs ALSA headers to build; golden tests need a software
      # Vulkan adapter (lavapipe); the smoke run needs an X server and
      # winit's keyboard support needs libxkbcommon-x11.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Tests (Linux — golden images required)
        if: runner.os == 'Linux'
        run: cargo test --workspace
        env:
          TRINO_REQUIRE_GPU: "1"
      # The PC native profile's old CPU T&L path (issue #51): every PC
      # renderer test with the GPU path off (`gpu_tnl.rs` turns it on).
      - name: Tests (Linux — TRINO_PC_TNL=cpu)
        if: runner.os == 'Linux'
        run: cargo test -p trino-platform-pc
        env:
          TRINO_REQUIRE_GPU: "1"
          TRINO_PC_TNL: cpu
      - name: Tests (Windows/macOS — golden skipped if no adapter)
        if: runner.os != 'Linux'
        run: cargo test --workspace
      - run: cargo build -p trino-app-pc
      - run: cargo build -p trino-app-pc --features reload
      - run: cargo build -p trino-editor
      - name: Smoke run (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc
      # Issue #62: the PC's trace end to end (zones, GPU passes where the
      # adapter has timestamps), then a smoke run with the zones in whose
      # lines `trace report` reads back.
      - name: Trace (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p trino-platform-pc --features trino-core/trace --test trace_zones
          TRINO_TRACE=target/traces/smoke.log TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc --features trino-core/trace
          cargo xtask trace collect target/traces/smoke.log --out target/traces/smoke.json
          cargo xtask trace report target/traces/smoke.json --json > target/traces/report.json
          grep -q '"session":"pc-castle64"' target/traces/report.json
        env:
          TRINO_REQUIRE_GPU: "1"
      # The quality presets (issue #55) on the native profile: a run at each
      # preset (TRINO_FRAME says it), the first launch's calibration (auto),
      # then the CLI's check and bench.
      - name: Quality preset smokes (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          for q in low medium high ultra; do
            TRINO_SIM=native TRINO_QUALITY=$q TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc > target/quality-$q.log
            grep TRINO_FRAME target/quality-$q.log | grep "quality=$q "
          done
          TRINO_SIM=native TRINO_QUALITY=auto TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc > target/quality-auto.log
          grep "TRINO_QUALITY: bench" target/quality-auto.log
          cargo xtask quality check
          xvfb-run -a cargo xtask quality bench --json
      - name: Scene player smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_SCENE=scenes/showcase.scene.ron TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc
      - name: Exported-scene game smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_GAME=showcase TRINO_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-app-pc
      # A project argument opens the editor (no argument: the launcher).
      - name: Editor smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_EDITOR_SMOKE_FRAMES=30 xvfb-run -a cargo run -p trino-editor -- .
      - name: Editor project launcher smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_EDITOR_RECENT=target/recent-projects.txt TRINO_EDITOR_SMOKE_FRAMES=30 xvfb-run -a cargo run -p trino-editor
      # Headless editor flows (egui_kittest): own process state, so alone.
      - name: Editor UI tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p trino-editor ui_tests -- --ignored --test-threads=1
        env:
          TRINO_REQUIRE_GPU: "1"
      - name: Editor Play-here smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: TRINO_EDITOR_PLAY=here TRINO_EDITOR_SMOKE_FRAMES=60 xvfb-run -a cargo run -p trino-editor
      # `cargo xtask new --standalone` into a temp dir, built and run there;
      # every --template (blank, castle64, showcase) must `cargo check`.
      - name: Standalone project smoke (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p xtask --test standalone -- --include-ignored
        env:
          TRINO_REQUIRE_GPU: "1"

  # Shipping a game (issue #61): the football template packaged on each OS
  # as players get it (fat LTO, the version stamped, assets baked in, Steam's
  # library beside it), run from outside the repository for 30 frames, then
  # crashed on purpose (the report must land in the save folder). The
  # artifacts are the downloadable builds.
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev mesa-vulkan-drivers xvfb libxkbcommon-x11-0 squashfs-tools
      - name: Scaffold the football template (Steam app 480)
        shell: bash
        run: |
          rm -rf target/test-projects/ci-ship
          cargo xtask new ci-ship --standalone target/test-projects/ci-ship --template football
          printf '\n[steam]\napp_id = 480\n\n[itch]\ntarget = "trino/ci-ship"\n' >> target/test-projects/ci-ship/trino.toml
      - name: Package, smoke-run and crash-check (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask package pc --project target/test-projects/ci-ship --steam --itch --smoke --json > target/package.json
        env:
          TRINO_REQUIRE_GPU: "1"
      - name: Package, smoke-run and crash-check
        if: runner.os != 'Linux'
        shell: bash
        run: cargo xtask package pc --project target/test-projects/ci-ship --steam --itch --smoke --json > target/package.json
      - name: Show the report
        shell: bash
        run: cat target/package.json
      # The .exe's icon and version resource, as Windows reads them.
      - name: Windows version information
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $r = Get-Content target/package.json | ConvertFrom-Json
          $exe = Get-ChildItem -Recurse -Filter ci-ship.exe $r.folder | Select-Object -First 1
          $v = (Get-Item $exe.FullName).VersionInfo
          $v | Format-List ProductName,ProductVersion,FileVersion,CompanyName,OriginalFilename
          if ($v.ProductVersion -ne $r.version) { throw "ProductVersion '$($v.ProductVersion)' is not '$($r.version)'" }
          if ($v.OriginalFilename -ne 'ci-ship.exe') { throw "OriginalFilename '$($v.OriginalFilename)'" }
      - name: SteamPipe and butler layouts
        shell: bash
        run: |
          find target/test-projects/ci-ship/dist/steam/scripts target/test-projects/ci-ship/dist/itch -maxdepth 2 | sort
          test -f target/test-projects/ci-ship/dist/steam/scripts/app_build_480.vdf
          test -f target/test-projects/ci-ship/dist/itch/*/.itch.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ship-${{ runner.os }}
          path: |
            target/test-projects/ci-ship/dist/*.AppImage
            target/test-projects/ci-ship/dist/*.zip
            target/test-projects/ci-ship/dist/*.dmg
            target/test-projects/ci-ship/dist/*-smoke.png
          if-no-files-found: ignore

  # The Web target (issue #47) in one job: the wasm build once, then the
  # browser self-test in Chromium (WebGL2, and WebGPU on SwiftShader's
  # Vulkan), Firefox and WebKit from the same build, served once — one
  # runner, one cargo cache, no browser matrix.
  web:
    name: Web (Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web-test/package-lock.json
      # xtask links the PC crates (cpal -> ALSA headers).
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # The wasm-bindgen CLI `build web` installs into target/tools, keyed on
      # the lockfile's wasm-bindgen.
      - name: Cache the wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: target/tools
          key: wasm-bindgen-cli-${{ hashFiles('Cargo.lock') }}
      - name: Clippy (wasm32)
        run: cargo clippy -p trino-render-wgpu -p trino-platform-web -p trino-app-web --target wasm32-unknown-unknown -- -D warnings
      - name: Playwright and its browsers
        working-directory: tools/web-test
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Build (wasm, release)
        run: cargo xtask build web --release
      # TRINO_TEST_PASS, the KTX2 transcode, saves across a reload, audio
      # unlocked by a click, input reaching the game, and the golden frames
      # (tests/golden/web/) — per browser.
      # Firefox: headless on a GPU-less Linux has no WebGL, headed under Xvfb
      # it gets Mesa's llvmpipe; and its AudioContext never leaves
      # `suspended` without an output device, so PulseAudio plays into a
      # null sink.
      - name: Audio output for the browsers (PulseAudio null sink)
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=trino
      - name: Browser self-test (Chromium WebGL2 + WebGPU, Firefox, WebKit)
        run: xvfb-run -a cargo xtask test web --no-build
        env:
          TRINO_SKIP_BROWSER_INSTALL: "1"
          TRINO_WEB_TIMEOUT: "900"
          TRINO_WEB_FIREFOX_HEADED: "1"
      # A project scaffolded from a template, built for the Web and run in
      # Chromium: what `cargo xtask new --standalone` users get.
      - name: Standalone project in the browser
        run: |
          rm -rf target/test-projects/ci-web  # the cargo cache restores target/
          cargo xtask new ci-web --standalone target/test-projects/ci-web --template castle64
          CARGO_TARGET_DIR=$PWD/target cargo xtask test web --project target/test-projects/ci-web --browsers chromium
        env:
          TRINO_SKIP_BROWSER_INSTALL: "1"
      - name: Upload the browser runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test
          path: |
            target/web-test/
            tests/golden/web/actual/
          if-no-files-found: ignore

  hot-reload:
    name: Hot reload E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # xtask's dev-deps pull the PC backend (cpal -> ALSA headers).
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Builds the game dylib twice and swaps them under a live state.
      - run: cargo test -p xtask --test hot_reload -- --ignored

  n64:
    name: N64 ROM (libdragon container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # xtask itself builds on stable (rust-toolchain.toml); the MIPS target
      # build is invoked as `cargo +nightly` with build-std, hence rust-src.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The toolchain image compiles libdragon from a pinned commit (~10 min);
      # cache the built image keyed on the Dockerfile.
      - name: Cache toolchain image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: ~/trino-n64.tar
          key: trino-n64-image-${{ hashFiles('docker/n64/**') }}
      - name: Load cached toolchain image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/trino-n64.tar
      - name: Build ROM
        run: cargo xtask build n64
      - name: Save toolchain image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save trino-n64 -o ~/trino-n64.tar
      - name: ROM produced
        run: ls -l target/n64/trino.z64
      # Emulator self-test: ares (built from source into a Docker image —
      # it ships no Linux binary) boots the test ROM under Xvfb; the
      # harness asserts TRINO_TEST_PASS and the golden frame
      # (tests/golden/n64/showcase.png) pixel for pixel.
      - name: Cache ares image
        id: ares-cache
        uses: actions/cache@v4
        with:
          path: ~/trino-ares.tar
          key: trino-ares-image-${{ hashFiles('docker/ares/Dockerfile') }}
      - name: Load cached ares image
        if: steps.ares-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/trino-ares.tar
      - name: Build ares image
        if: steps.ares-cache.outputs.cache-hit != 'true'
        run: cargo xtask emulators setup ares
      - name: Save ares image
        if: steps.ares-cache.outputs.cache-hit != 'true'
        run: docker save trino-ares -o ~/trino-ares.tar
      # Both hardware tiers (issue #54): one ROM booted with the Expansion
      # Pak (8 MB, the expanded tier's data) and without (4 MB, the base
      # tier's); each run checks the ROM's TRINO_HW line and the data it
      # loaded against ares's setting.
      - name: Emulator self-test (ares, with and without the Expansion Pak)
        run: cargo xtask test n64 --expansion-pak both
        env:
          TRINO_ARES: docker
          # lavapipe on a 4-core runner; the harness default is 300 s.
          TRINO_EMU_TIMEOUT: "900"
      # The football template (Solid Eleven) as a user gets it: scaffolded
      # into its own project, built, its scripted match timed in ares
      # against trino.toml's 33.3 ms budget, its sim hash and golden frame.
      - name: Football template self-test (ares)
        run: |
          rm -rf target/test-projects/ci-football  # the cargo cache restores target/
          cargo xtask new ci-football --standalone target/test-projects/ci-football --template football
          cargo xtask test n64 --project target/test-projects/ci-football
        env:
          TRINO_ARES: docker
          TRINO_EMU_TIMEOUT: "900"
      - name: Upload golden mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n64-golden-actual
          path: |
            tests/golden/n64/actual/
            target/test-projects/ci-football/tests/golden/n64/actual/
          if-no-files-found: ignore

  n3ds:
    name: 3DS app (devkitARM container)
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      # The image ships devkitARM + libctru/citro2d/citro3d + tools at
      # /opt/devkitpro; only Rust is missing. rust-toolchain.toml pulls
      # stable for xtask; the target build is `cargo +nightly` w/ build-std.
      - name: Install Rust (nightly + rust-src)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain nightly --component rust-src
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - name: Build .3dsx
        run: cargo xtask build 3ds
      - name: App produced
        run: ls -l target/3ds/trino.3dsx
      # The self-test app is booted by the next job: Azahar's AppImage needs
      # a newer glibc than this (Debian) toolchain image ships.
      - name: Build self-test app
        run: cargo xtask build 3ds --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: trino-3ds-selftest
          path: target/3ds/trino.3dsx
      # The installable title (issue #61) is packed by the next job: makerom
      # and ctrtool need glibc 2.38, this Debian image has 2.36. The
      # self-test's ELF, RomFS and SMDH go there.
      - uses: actions/upload-artifact@v4
        with:
          name: trino-3ds-cia-inputs
          path: |
            target/armv6k-nintendo-3ds/release/trino-3ds.elf
            target/3ds/trino.smdh
            target/3ds/romfs/
      # The football template's self-test app (booted by the next job).
      - name: Build the football template's self-test app
        run: |
          rm -rf target/test-projects/ci-football  # the cargo cache restores target/
          cargo xtask new ci-football --standalone target/test-projects/ci-football --template football
          cargo xtask build 3ds --project target/test-projects/ci-football --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: football-3ds-selftest
          path: target/test-projects/ci-football/target/3ds/ci-football.3dsx

  n3ds-emulator:
    name: 3DS self-test (Azahar)
    needs: n3ds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: trino-3ds-selftest
          path: target/3ds
      # The pinned Azahar AppImage (SHA-256 checked, extracted) boots the
      # test app under Xvfb with Mesa's software OpenGL; the harness seeds
      # Azahar's config (Debug.Emulated log level, per-line flush) and tails
      # its log for the TRINO_TEST_* magic strings.
      - name: Install emulator runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev xvfb xauth \
            libopengl0 libegl1 libgl1 libgl1-mesa-dri libfontconfig1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-shape0 libxcb-cursor0 libdbus-1-3 libglib2.0-0 libxi6 libsm6 libice6 \
            libharfbuzz0b libfribidi0
      - name: Set up Azahar
        run: cargo xtask emulators setup azahar
      # Both hardware tiers (issue #54): Azahar as a New 3DS (speedup on:
      # the expanded tier, the worker on core 2) and as an old 3DS (the base
      # tier, the worker on core 1).
      - name: Emulator self-test (Azahar, New 3DS and old 3DS)
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo xtask test 3ds --no-build --new3ds both
        env:
          TRINO_EMU_TIMEOUT: "900"
      # The installable title (issue #61): the self-test's ELF and RomFS
      # packed by makerom (bannertool and ctrtool too, fetched pinned;
      # ctrtool reads the .cia back), then its NCCH (.cxi, what a title
      # manager installs) runs the whole self-test through the same harness.
      - uses: actions/download-artifact@v4
        with:
          name: trino-3ds-cia-inputs
          path: target
      - name: Package the self-test as a .cia
        run: cargo xtask package 3ds --cia --no-build --out target/cia
      - name: Installable title self-test (Azahar, the .cia's NCCH)
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo xtask test 3ds --no-build
        env:
          TRINO_EMU_TIMEOUT: "900"
          TRINO_3DS_APP: ${{ github.workspace }}/target/cia/trino.cxi
      - uses: actions/upload-artifact@v4
        with:
          name: trino-3ds-cia
          path: |
            target/cia/trino.cia
            target/cia/trino.cxi
      # The football template: the same project scaffolded again (its
      # trino.toml and goldens), the app the previous job built.
      - name: Scaffold the football template
        run: |
          rm -rf target/test-projects/ci-football  # the cargo cache restores target/
          cargo xtask new ci-football --standalone target/test-projects/ci-football --template football
      - uses: actions/download-artifact@v4
        with:
          name: football-3ds-selftest
          path: target/test-projects/ci-football/target/3ds
      - name: Football template self-test (Azahar)
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo xtask test 3ds --project target/test-projects/ci-football --no-build
        env:
          TRINO_EMU_TIMEOUT: "900"
      # The golden frame is compared within a tolerance (Azahar's output
      # depends on the host OpenGL); on a mismatch the frame lands here.
      - name: Upload golden mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n3ds-golden-actual
          path: |
            tests/golden/3ds/actual/
            target/test-projects/ci-football/tests/golden/3ds/actual/
          if-no-files-found: ignore
