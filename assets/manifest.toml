# ---- fonts (bitmap text: atlas sprite + glyph table under one handle) ----

# trino5x7: the engine's default pixel font (xtask gen-assets draws it).
# I4 on the N64: its 2 880 bytes of texels fit TMEM whole, so text stays
# resident (one upload a string); as CI4 the palette left them 2 KB and every
# glyph re-uploaded (GitHub #99).
[fonts.trino5x7]
file = "fonts/trino5x7.png"
cell = [6, 10]
formats = { n64 = "I4" }

# Localized text (castle64::selftest::i18n, issue #59): Roboto Condensed
# (Apache-2.0, fonts/LICENSE-Roboto.txt) baked with exactly the glyphs
# assets/i18n/ uses, one atlas per language (`fonts/i18n@pt-BR`, ...).
[fonts.i18n]
file = "fonts/RobotoCondensed-Bold.ttf"
size = 11
chars = "auto"
per_language = true
formats = { n64 = "I4" }

[i18n]
default = "en-US"
# The localized text draws with fonts/i18n (the UI self-test screen's
# trino5x7 shows its own ASCII labels).
check_fonts = ["fonts/i18n"]

# ---- blobs (raw bytes by handle: Platform::blob) ----

# ---- self-test content (castle64::selftest::AudioCodecs, issue #53) ----
# The same beep as PCM and as the platform's codec; a short track as Opus on
# the N64 (the platform's default codec elsewhere).
[sounds.selftest_pcm]
file = "sounds/beep.wav"
codec = "pcm"

[sounds.selftest_codec]
file = "sounds/beep.wav"

[music.selftest_opus]
file = "sounds/win.wav"
loop = false
codec = { n64 = "opus" }

# Read back by the console self-tests (castle64::selftest).
[blobs.selftest]
file = "data/selftest.txt"

# Boot compressed on the consoles (issue #56, ADR 0022): libdragon's LZ4
# on the N64 (`asset_load` decodes as it reads), LZ4 in `groups/boot.tbnd`
# on the 3DS (decoded on the worker core at boot). The PC and the Web keep
# loose files.
[groups.boot]
compression = { n64 = 1, 3ds = "lz4" }

# ---- self-test content (castle64::selftest::asset_groups, issue #56) ----
# Two groups the self-tests load behind a loading bar, draw from and unload
# (PC, ares, Azahar). The tile is in both: uploaded once, freed with the
# last of them. `selftest_level2` takes libdragon's aPLib on the N64.
# The strider (issue #65): loaded by the animation self-test steps and by
# scenes that `require` it (scenes/striders.scene.ron).
[groups.strider]

# Issue #67: a PC recording of castle64's bot (green hills, 731 frames, a
# state hash every frame; `TRINO_BOT=green TRINO_RECORD=...`). The `replay`
# self-test step plays it on every target and compares the hashes: the
# cross-platform determinism gate. Loaded by that step only.
[groups.replay]

[blobs.replay_castle64]
file = "replays/castle64_green.trec"
groups = ["replay"]

[groups.selftest_level]

[groups.selftest_level2]
compression = { n64 = 2 }

[sprites.selftest_level_tile]
file = "sprites/selftest_quadrants.png"
formats = { n64 = "CI4" }
groups = ["selftest_level", "selftest_level2"]

[models.selftest_level_card]
file = "models/proxies/selftest-card.prim.ron"
texture = "sprites/selftest_level_tile"
groups = ["selftest_level"]

[blobs.selftest_level]
file = "data/selftest_level.txt"
groups = ["selftest_level"]

[blobs.selftest_level2]
file = "data/selftest_level.txt"
groups = ["selftest_level2"]

[sounds.selftest_level]
file = "sounds/beep.wav"
groups = ["selftest_level2"]

